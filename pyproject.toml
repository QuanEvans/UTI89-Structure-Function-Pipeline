[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uti89-structure-function-pipeline"
version = "0.1.0"
description = "Sequence-to-structure-to-function workflow for UTI89 proteome annotation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Quancheng Liu", email = "quanch@umich.edu" }
]
dependencies = [
  "gemmi>=0.6",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7"
]

[tool.setuptools.packages.find]
where = ["src"]
