# Generic template for running the full decision-tree -> structure -> StarFunc
# pipeline. Copy this file and replace every /path/to/... value.

run:
  name: my_run
  work_dir: /path/to/output/run
  input_fasta: /path/to/input.fasta

execution:
  # Use "local" on a workstation or "slurm" on an HPC with Slurm.
  backend: local
  local_cores: 8
  use_modules: false

decision_tree:
  # The decision tree is implemented in this repository. It can use supplied
  # hit reports, AlphaFold DB API accession lookups, AlphaFold DB API sequence
  # lookup, and/or a local PDB DIAMOND database.
  conda_executable: /path/to/conda
  use_afdb_api: true
  afdb_sequence_search: true
  afdb_sequence_rows: 20
  # Optional precomputed hit reports. Columns may include protein_id, match,
  # seq_id, query_coverage, target_coverage, qlen, slen, plddt, and pdb_path.
  # pdb_path can be a local PDB path or an HTTP(S) URL for AFDB templates.
  # afdb_hits_tsv: /path/to/afdb_hits.tsv
  # pdb_hits_tsv: /path/to/pdb_hits.tsv
  # Optional local PDB DIAMOND database. Create it with
  # scripts/setup_pdb_diamond.py --out-dir /path/to/pdb-diamond
  # pdb_dmnd: /path/to/pdb-diamond/pdb.dmnd
  # diamond_executable: /path/to/diamond
  pdb_min_seq_id: 0.95
  pdb_min_query_coverage: 0.8
  af_min_seq_id: 0.9
  af_min_query_coverage: 0.8
  af_min_target_coverage: 0.8
  af_min_plddt: 70
  af_exact_seq_id: 1.0

structure_prediction:
  enabled_steps:
    - GETSEQS
    - AFDB
    - MODELLER
    - LOMETS
    - DITASSER
  tools:
    singularity_command: singularity
    seq2fun_sif: /path/to/seq2fun.sif
    ditasser_pkgdir: /path/to/D-I-TASSER-2.0
    itlib_dir: /path/to/ITLIB
    scratch_bind: /path/to/scratch
    # Optional; only required if DMFOLD is added to enabled_steps.
    dmfold_base: /path/to/DMFold
    dmfold_conda_env: /path/to/dmfold-conda-env

function_prediction:
  link_inputs: true
  singularity_command: singularity
  starfunc_sif: /path/to/StarFunc.sif
  starfunc_database: /path/to/StarFunc/database
